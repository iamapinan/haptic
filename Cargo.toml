[package]
name = "haptic-mac"
version = "0.2.4"
edition = "2021"
default-run = "haptic-mac"

[dependencies]
objc = "0.2"
block = "0.1.6"
core-graphics = "0.24"
core-foundation = "0.10"
rodio = "0.19"

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy", "cargo_clippy"))'] }
